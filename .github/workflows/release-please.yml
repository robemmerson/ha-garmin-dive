name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # This is the whole release process. release-please tags the commit,
      # publishes the GitHub Release, and syncs the version into
      # pyproject.toml and manifest.json via `extra-files` in
      # release-please-config.json. HACS installs from the repository source,
      # so no release artifact is built or attached.
