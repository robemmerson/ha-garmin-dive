name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: home-assistant/actions/hassfest@master  # intentional floating ref; HA team's canonical recommendation

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: HACS Action
        uses: hacs/action@main  # intentional floating ref; HACS maintainers' canonical recommendation
        with:
          category: integration
