name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: home-assistant/actions/hassfest@master  # intentional floating ref; HA team's canonical recommendation

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: HACS Action
        uses: hacs/action@main  # intentional floating ref; HACS maintainers' canonical recommendation
        with:
          category: integration
